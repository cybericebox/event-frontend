apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-frontend
  namespace: cybericebox
  labels:
    app: event-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: event-frontend
  template:
    metadata:
      name: event-frontend
      namespace: cybericebox
      labels:
        app: event-frontend
    spec:
      containers:
        - name: event-frontend
          image: cybericebox/event-frontend:latest
          env:
            - name: NEXT_PUBLIC_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: DOMAIN
            - name: NEXT_PUBLIC_API_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: API_DOMAIN
            - name: NEXT_PUBLIC_ID_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: ID_DOMAIN
            - name: NEXT_PUBLIC_EXERCISES_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: EXERCISES_DOMAIN
            - name: NEXT_PUBLIC_ADMIN_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: ADMIN_DOMAIN
            - name: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: GOOGLE_ANALYTICS_ID
          ports:
            - containerPort: 3000
              protocol:  TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              port: 3000
              path: /api/health
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              port: 3000
              path: /api/health
            initialDelaySeconds: 20
            periodSeconds: 30