apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-frontend
  namespace: cybericebox
  labels:
    app: event-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 3
      maxUnavailable: 0
  selector:
    matchLabels:
      app: event-frontend
  template:
    metadata:
      name: event-frontend
      namespace: cybericebox
      labels:
        app: event-frontend
    spec:
      containers:
        - name: event-frontend
          image: cybericebox/event-frontend:v0.1.0 # the release tag: an exact version, never latest
          imagePullPolicy: IfNotPresent
          env:
            - name: NEXT_PUBLIC_MAIN_HOST
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: MAIN_HOST
            - name: NEXT_PUBLIC_API_HOST
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: API_HOST
            - name: NEXT_PUBLIC_ID_HOST
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: ID_HOST
            - name: NEXT_PUBLIC_ADMIN_HOST
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: ADMIN_HOST
            - name: NEXT_PUBLIC_EXERCISES_HOST
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: EXERCISES_HOST
            - name: NEXT_PUBLIC_EVENT_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: EVENT_DOMAIN
            - name: NEXT_PUBLIC_COOKIE_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: COOKIE_DOMAIN
            - name: NEXT_PUBLIC_SUPPORT_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: SUPPORT_EMAIL
            - name: NEXT_PUBLIC_PARTNER_URL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: PARTNER_URL
            - name: NEXT_PUBLIC_PARTNER_SITE_URL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: PARTNER_SITE_URL
            - name: NEXT_PUBLIC_WIREGUARD_INSTALL_URL
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: WIREGUARD_INSTALL_URL
            - name: NEXT_PUBLIC_GOOGLE_ANALYTICS_ID
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: GOOGLE_ANALYTICS_ID
            - name: NEXT_PUBLIC_CAPTCHA_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: CAPTCHA_PROVIDER
                  optional: true
            - name: NEXT_PUBLIC_CAPTCHA_SITE_KEY
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: CAPTCHA_SITE_KEY
                  optional: true
            - name: NEXT_PUBLIC_RECAPTCHA_ENTERPRISE
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: RECAPTCHA_ENTERPRISE
                  optional: true
            - name: NEXT_PUBLIC_DOS_PROTECTION
              valueFrom:
                configMapKeyRef:
                  name: config
                  key: DOS_PROTECTION
                  optional: true
          ports:
            - containerPort: 3000
              protocol:  TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              port: 3000
              path: /api/health
            initialDelaySeconds: 20
          livenessProbe:
            httpGet:
              port: 3000
              path: /api/health
            initialDelaySeconds: 20
            periodSeconds: 30