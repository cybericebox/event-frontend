# The server block. Which listeners and TLS settings it has is decided by the three snippets included first;
# the entrypoint renders each active one and an empty file for each inactive one.
server {
  include /tmp/nginx/listen-http.conf;
  include /tmp/nginx/listen-https.conf;
  include /tmp/nginx/client-auth.conf;
  server_name _;

  location /_next/static/ {
    alias /app/.next/static/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Files of public/ (anything with an extension) from disk; everything else, and a missing file, goes to Next.
  location ~* \.[a-z0-9]+$ {
    root /app/public;
    try_files $uri @next;
  }

  location / {
    try_files /dev/null @next;
  }

  location @next {
    proxy_pass http://next;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;
    # Client certificate verification result (SUCCESS, FAILED:reason, NONE); always set by nginx, never by the client.
    proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # A missing or invalid client certificate: the connection is closed without any response.
  location @drop {
    return 444;
  }
}
