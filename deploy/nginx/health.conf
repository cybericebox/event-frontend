# Plain listener for kubelet probes: serves only the health path.
server {
  listen ${HEALTH_BIND}:${HEALTH_PORT};
  access_log off;

  location = /api/health {
    proxy_pass http://next;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
  }

  location / {
    return 404;
  }
}
