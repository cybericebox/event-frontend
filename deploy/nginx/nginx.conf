# Main config. Rendered by entrypoint.sh (envsubst over a fixed variable list) to /tmp/nginx; the root
# filesystem is read-only, so every writable path is under /tmp/nginx.
daemon off;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
worker_processes 2;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  server_tokens off;
  sendfile on;
  client_max_body_size 64m;
  keepalive_timeout 75s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
    application/xml application/manifest+json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
  }

  # Next.js is internal.
  upstream next {
    server 127.0.0.1:3001;
    keepalive 32;
  }

  include /tmp/nginx/server.conf;
  # Empty unless HEALTH_PORT is set.
  include /tmp/nginx/health.conf;
}
